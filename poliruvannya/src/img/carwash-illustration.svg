<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="carwashTitle">
	<title id="carwashTitle">Ілюстрація детейлінг-догляду за авто CarLux</title>

	<defs>
		<linearGradient id="cwCarBody" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2a3b57"/>
			<stop offset="1" stop-color="#16233a"/>
		</linearGradient>
		<radialGradient id="cwGlow" cx="50%" cy="50%" r="50%">
			<stop offset="0" stop-color="#2196f3" stop-opacity=".18"/>
			<stop offset="1" stop-color="#2196f3" stop-opacity="0"/>
		</radialGradient>
	</defs>

	<!-- фонове сяйво -->
	<ellipse cx="360" cy="200" rx="280" ry="170" fill="url(#cwGlow)"/>

	<!-- лінії-промені від значків до авто -->
	<g stroke="#2196f3" stroke-width="1.5" stroke-dasharray="4 5" opacity=".5">
		<line x1="150" y1="90"  x2="272" y2="140"/>
		<line x1="570" y1="90"  x2="448" y2="140"/>
		<line x1="120" y1="290" x2="255" y2="255"/>
		<line x1="600" y1="290" x2="465" y2="255"/>
	</g>

	<!-- кузов авто, вигляд згори -->
	<g>
		<rect x="272" y="100" width="176" height="200" rx="42" fill="url(#cwCarBody)" stroke="#3a9be0" stroke-width="2"/>
		<!-- лобове/заднє скло -->
		<rect x="294" y="128" width="132" height="46" rx="13" fill="#0b1526" stroke="#2196f3" stroke-width="1.5" opacity=".9"/>
		<rect x="294" y="228" width="132" height="46" rx="13" fill="#0b1526" stroke="#2196f3" stroke-width="1.5" opacity=".9"/>
		<!-- центральна лінія даху -->
		<line x1="360" y1="182" x2="360" y2="220" stroke="#2196f3" stroke-width="1.5" opacity=".6"/>
		<!-- дзеркала -->
		<rect x="260" y="150" width="14" height="8" rx="3" fill="#3a9be0"/>
		<rect x="446" y="150" width="14" height="8" rx="3" fill="#3a9be0"/>
		<!-- колеса -->
		<rect x="254" y="128" width="18" height="42" rx="8" fill="#060c17" stroke="#2196f3" stroke-width="1.5"/>
		<rect x="448" y="128" width="18" height="42" rx="8" fill="#060c17" stroke="#2196f3" stroke-width="1.5"/>
		<rect x="254" y="230" width="18" height="42" rx="8" fill="#060c17" stroke="#2196f3" stroke-width="1.5"/>
		<rect x="448" y="230" width="18" height="42" rx="8" fill="#060c17" stroke="#2196f3" stroke-width="1.5"/>
		<!-- блиск -->
		<path d="M302 108 q58 -13 116 0" stroke="#7fc4ff" stroke-width="2" fill="none" opacity=".5" stroke-linecap="round"/>
	</g>

	<!-- значок: крапля (аква-хімчистка) -->
	<g transform="translate(150,90)">
		<circle r="32" fill="#0d1a30" stroke="#2196f3" stroke-width="1.5"/>
		<path d="M0 -13 C8 -2 13 5 13 12 A13 13 0 0 1 -13 12 C-13 5 -8 -2 0 -13 Z" fill="none" stroke="#7fc4ff" stroke-width="2.2" stroke-linejoin="round"/>
		<text x="0" y="54" text-anchor="middle" font-size="14" font-weight="500" fill="#e8f1ff" font-family="sans-serif">Аква-хімчистка</text>
	</g>

	<!-- значок: спрей (професійна хімія) -->
	<g transform="translate(570,90)">
		<circle r="32" fill="#0d1a30" stroke="#2196f3" stroke-width="1.5"/>
		<rect x="-6.5" y="-3.5" width="13" height="22" rx="3" fill="none" stroke="#7fc4ff" stroke-width="2.2"/>
		<rect x="-2.5" y="-13" width="5" height="9.5" rx="1.3" fill="none" stroke="#7fc4ff" stroke-width="2"/>
		<line x1="9" y1="-5" x2="16" y2="-10" stroke="#7fc4ff" stroke-width="1.8" stroke-linecap="round"/>
		<line x1="11" y1="0" x2="19" y2="-1" stroke="#7fc4ff" stroke-width="1.8" stroke-linecap="round"/>
		<line x1="9" y1="6" x2="17" y2="8" stroke="#7fc4ff" stroke-width="1.8" stroke-linecap="round"/>
		<text x="0" y="54" text-anchor="middle" font-size="14" font-weight="500" fill="#e8f1ff" font-family="sans-serif">Професійна хімія</text>
	</g>

	<!-- значок: полірування (кругові рухи) -->
	<g transform="translate(120,290)">
		<circle r="32" fill="#0d1a30" stroke="#2196f3" stroke-width="1.5"/>
		<path d="M10 -10 A14 14 0 1 0 14 3" fill="none" stroke="#7fc4ff" stroke-width="2.2" stroke-linecap="round"/>
		<path d="M10 -17 L10 -10 L3.5 -8.5" fill="none" stroke="#7fc4ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
		<circle cx="0" cy="0" r="2.6" fill="#7fc4ff"/>
		<text x="0" y="54" text-anchor="middle" font-size="14" font-weight="500" fill="#e8f1ff" font-family="sans-serif">Полірування</text>
	</g>

	<!-- значок: захисне покриття (блиск) -->
	<g transform="translate(600,290)">
		<circle r="32" fill="#0d1a30" stroke="#2196f3" stroke-width="1.5"/>
		<path d="M0 -14 L3.2 -3.2 L14 0 L3.2 3.2 L0 14 L-3.2 3.2 L-14 0 L-3.2 -3.2 Z" fill="none" stroke="#7fc4ff" stroke-width="2" stroke-linejoin="round"/>
		<text x="0" y="54" text-anchor="middle" font-size="14" font-weight="500" fill="#e8f1ff" font-family="sans-serif">Захисне покриття</text>
	</g>
</svg>
