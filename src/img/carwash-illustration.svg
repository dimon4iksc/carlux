<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="carwashTitle">
	<title id="carwashTitle">Ілюстрація детейлінг-догляду за авто CarLux</title>

	<defs>
		<linearGradient id="cwCarBody" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2a3b57"/>
			<stop offset="1" stop-color="#16233a"/>
		</linearGradient>
		<radialGradient id="cwGlow" cx="50%" cy="50%" r="50%">
			<stop offset="0" stop-color="#2196f3" stop-opacity=".22"/>
			<stop offset="1" stop-color="#2196f3" stop-opacity="0"/>
		</radialGradient>
	</defs>

	<!-- фонове сяйво -->
	<ellipse cx="360" cy="235" rx="300" ry="200" fill="url(#cwGlow)"/>

	<!-- лінії-промені від значків до авто -->
	<g stroke="#2196f3" stroke-width="1.5" stroke-dasharray="4 5" opacity=".55">
		<line x1="150" y1="95"  x2="270" y2="150"/>
		<line x1="570" y1="95"  x2="450" y2="150"/>
		<line x1="120" y1="330" x2="255" y2="290"/>
		<line x1="600" y1="330" x2="465" y2="290"/>
		<line x1="360" y1="60"  x2="360" y2="130"/>
	</g>

	<!-- кузов авто, вигляд згори -->
	<g>
		<rect x="270" y="120" width="180" height="230" rx="46" fill="url(#cwCarBody)" stroke="#3a9be0" stroke-width="2"/>
		<!-- лобове/заднє скло -->
		<rect x="292" y="150" width="136" height="52" rx="14" fill="#0b1526" stroke="#2196f3" stroke-width="1.5" opacity=".9"/>
		<rect x="292" y="268" width="136" height="52" rx="14" fill="#0b1526" stroke="#2196f3" stroke-width="1.5" opacity=".9"/>
		<!-- центральна лінія даху -->
		<line x1="360" y1="210" x2="360" y2="260" stroke="#2196f3" stroke-width="1.5" opacity=".6"/>
		<!-- дзеркала -->
		<rect x="258" y="175" width="14" height="8" rx="3" fill="#3a9be0"/>
		<rect x="448" y="175" width="14" height="8" rx="3" fill="#3a9be0"/>
		<!-- колеса -->
		<rect x="252" y="150" width="18" height="46" rx="8" fill="#060c17" stroke="#2196f3" stroke-width="1.5"/>
		<rect x="450" y="150" width="18" height="46" rx="8" fill="#060c17" stroke="#2196f3" stroke-width="1.5"/>
		<rect x="252" y="274" width="18" height="46" rx="8" fill="#060c17" stroke="#2196f3" stroke-width="1.5"/>
		<rect x="450" y="274" width="18" height="46" rx="8" fill="#060c17" stroke="#2196f3" stroke-width="1.5"/>
		<!-- блиск -->
		<path d="M300 130 q60 -14 120 0" stroke="#7fc4ff" stroke-width="2" fill="none" opacity=".5" stroke-linecap="round"/>
	</g>

	<!-- значок: крапля (аква-хімчистка) -->
	<g transform="translate(150,95)">
		<circle r="34" fill="#0d1a30" stroke="#2196f3" stroke-width="1.5"/>
		<path d="M0 -14 C9 -2 14 6 14 13 A14 14 0 0 1 -14 13 C-14 6 -9 -2 0 -14 Z" fill="none" stroke="#7fc4ff" stroke-width="2.4" stroke-linejoin="round"/>
	</g>

	<!-- значок: спрей (професійна хімія) -->
	<g transform="translate(570,95)">
		<circle r="34" fill="#0d1a30" stroke="#2196f3" stroke-width="1.5"/>
		<rect x="-7" y="-4" width="14" height="24" rx="3" fill="none" stroke="#7fc4ff" stroke-width="2.4"/>
		<rect x="-3" y="-14" width="6" height="10" rx="1.5" fill="none" stroke="#7fc4ff" stroke-width="2.2"/>
		<line x1="10" y1="-6" x2="17" y2="-11" stroke="#7fc4ff" stroke-width="2" stroke-linecap="round"/>
		<line x1="12" y1="0" x2="20" y2="-1" stroke="#7fc4ff" stroke-width="2" stroke-linecap="round"/>
		<line x1="10" y1="7" x2="18" y2="9" stroke="#7fc4ff" stroke-width="2" stroke-linecap="round"/>
	</g>

	<!-- значок: полірування (кругові рухи) -->
	<g transform="translate(120,330)">
		<circle r="34" fill="#0d1a30" stroke="#2196f3" stroke-width="1.5"/>
		<path d="M11 -11 A15 15 0 1 0 15 3" fill="none" stroke="#7fc4ff" stroke-width="2.4" stroke-linecap="round"/>
		<path d="M11 -18 L11 -11 L4 -9" fill="none" stroke="#7fc4ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
		<circle cx="0" cy="0" r="3" fill="#7fc4ff"/>
	</g>

	<!-- значок: блиск/полірування -->
	<g transform="translate(600,330)">
		<circle r="34" fill="#0d1a30" stroke="#2196f3" stroke-width="1.5"/>
		<path d="M0 -15 L3.4 -3.4 L15 0 L3.4 3.4 L0 15 L-3.4 3.4 L-15 0 L-3.4 -3.4 Z" fill="none" stroke="#7fc4ff" stroke-width="2.2" stroke-linejoin="round"/>
	</g>

	<!-- значок: сушіння/повітря -->
	<g transform="translate(360,60)">
		<circle r="30" fill="#0d1a30" stroke="#2196f3" stroke-width="1.5"/>
		<path d="M-13 -2 h20 a6 6 0 1 0 -6 -9" fill="none" stroke="#7fc4ff" stroke-width="2.2" stroke-linecap="round"/>
		<path d="M-13 6 h15 a6 6 0 1 1 -6 9" fill="none" stroke="#7fc4ff" stroke-width="2.2" stroke-linecap="round"/>
	</g>
</svg>
